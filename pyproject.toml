[project]
name = "flowMC"
version = "0.4.5"
description = "Normalizing flow exhanced sampler in jax"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kaze W. K. Wong", email = "kazewong.physics@gmail.com"},
    { name = "Marylou Gabrié"},
    { name = "Dan Foreman-Mackey"}
]
maintainers = [
  {name = "Thomas Ng", email = "thomas.ng@nikhef.nl"}
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
keywords = ["sampling", "inference", "machine learning", "normalizing", "autodiff", "jax"]

dependencies = [
    "diffrax>=0.7.0",
    "equinox>=0.11.12",
    "jax>=0.8.2",
    "jaxtyping>=0.3.3",
    "optax>=0.2.7",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda]>=0.8.2",
]
visualize = [
    "arviz>=0.21.0",
    "corner>=2.2.3",
    "matplotlib>=3.10.7",
]

[dependency-groups]
test = [
    "coveralls>=4.0.1",
    "pre-commit>=4.0.1",
    "pyright>=1.1.402",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.2",
]
doc = [
    "mkdocs-gen-files",
    "mkdocs-jupyter<0.26.0",
    "mkdocs-literate-nav",
    "mkdocs-material",
    "mkdocs",
    "mkdocstrings[python]",
    "pymdown-extensions",
]

[project.urls]
Homepage = "https://github.com/GW-JAX-Team/flowMC"
Documentation = "https://flowmc.readthedocs.io"
Repository = "https://github.com/GW-JAX-Team/flowMC"
"Bug Tracker" = "https://github.com/GW-JAX-Team/flowMC/issues"
Changelog = "https://github.com/GW-JAX-Team/flowMC/releases"

[tool.uv.sources]
flowMC = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
ignore = ["F722"]

[tool.pyright]
include = [
    "src",
    "tests",
]

[tool.coverage.report]
exclude_also = [
    'def __repr__',
    "raise AssertionError",
    "raise NotImplementedError",
    "@(abc\\. )?abstractmethod",
]
